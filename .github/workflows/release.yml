# Publishes the selected build after both archives match their recorded hashes.
name: release

on:
  workflow_dispatch:
    inputs:
      run:
        description: Successful build.yml run id
        required: true
        type: string
      sha256_x86_64:
        description: Recorded sha256 of the tested x86_64 archive
        required: true
        type: string
      sha256_aarch64:
        description: Recorded sha256 of the tested aarch64 archive
        required: true
        type: string

# A run started while another builds waits behind it in order, up to a hundred deep, and none is
# canceled, so two never race to release one day, as runtime's publish queues.
concurrency:
  group: release
  queue: max

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as it is checked out at home, its scripts compiled.
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/driver
          scripts: true
      # The setup action installs the release scripts without a cargo cache.
      - uses: ./repos/monoflake/driver/.github/actions/setup
        with:
          cache: "false"
      - name: Promote build
        id: promote
        working-directory: repos/monoflake/driver
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.run }}
          RELEASE_SHA256_X86_64: ${{ inputs.sha256_x86_64 }}
          RELEASE_SHA256_AARCH64: ${{ inputs.sha256_aarch64 }}
        run: mise exec -- sh -c 'rescript build && node .github/release/promote.res.mjs'
      - name: Release
        if: steps.promote.outputs.ready == 'true'
        working-directory: repos/monoflake/driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release
      # Each day's notes are still rendered again when the version was already released.
      - name: Notes
        if: steps.promote.outputs.ready != 'true'
        working-directory: repos/monoflake/driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- node "$GITHUB_WORKSPACE/scripts/release/release.res.mjs" notes
