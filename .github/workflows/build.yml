# Builds both archives of driver-machine in a Release's shape on each push, kept three days as a
# workflow artifact a test ring takes, monoflake/cloud's RFC oej2a item 6. It holds no secret.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as release.yml checks it out.
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/driver
          scripts: true
      # The platform's crates and contracts at the commit release.yml builds on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: monoflake/platform
          ref: 1f37b5cb7cf42ca3bd63788f05e4a3231b042906 # monoflake/platform@main
          path: repos/monoflake/platform
          persist-credentials: false
      - name: install
        working-directory: repos/monoflake/driver
        run: |
          (cd ../platform && pnpm install --frozen-lockfile)
          pnpm install --frozen-lockfile
          mise exec -- rescript build
      - name: build
        working-directory: repos/monoflake/driver
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          mise run archive
      # The two archives alone, at the artifact's root, under the name the ring workflow downloads.
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-machine
          path: |
            repos/monoflake/driver/target/archives/driver-machine-*-linux-x86_64.tar.gz
            repos/monoflake/driver/target/archives/driver-machine-*-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 3
