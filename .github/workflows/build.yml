# Builds both archives of driver-machine in a Release's shape on each push, kept three days as a
# workflow artifact a test ring takes, monoflake/cloud's RFC oej2a item 6. It holds no secret.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, as release.yml checks it out.
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/driver
          scripts: true
      # The platform's crates and contracts at the commit release.yml builds on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: monoflake/platform
          ref: 1f37b5cb7cf42ca3bd63788f05e4a3231b042906 # monoflake/platform@main
          path: repos/monoflake/platform
          persist-credentials: false
      - name: install platform
        working-directory: repos/monoflake/platform
        run: pnpm install --frozen-lockfile
      - name: install driver
        working-directory: repos/monoflake/driver
        run: pnpm install --frozen-lockfile
      # The target directory and cargo's registry, kept between runs in the repository's cache and
      # shared with release.yml, the workspace's docs/ci.md.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: repos/monoflake/driver -> target
          shared-key: driver-machine
      - name: build
        working-directory: repos/monoflake/driver
        run: mise run archive
      # The two archives alone, at the artifact's root, under the name the ring workflow downloads.
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-machine
          path: |
            repos/monoflake/driver/target/archives/driver-machine-*-linux-x86_64.tar.gz
            repos/monoflake/driver/target/archives/driver-machine-*-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 3
