# Builds both archives of driver-machine in a Release's shape on each push, kept three days as a
# workflow artifact a test ring takes, monoflake/cloud's RFC oej2a item 6. It holds no secret.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The workspace above the repository, its scripts compiled.
      - uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: monoflake/driver
          scripts: true
      # The platform at its pin, both installs and cargo's cache, held by .github/actions/setup.
      - uses: ./repos/monoflake/driver/.github/actions/setup
      - name: build
        working-directory: repos/monoflake/driver
        run: mise run archive
      # The two archives alone, at the artifact's root, under the name the ring workflow downloads.
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-machine
          path: |
            repos/monoflake/driver/target/archives/driver-machine-*-linux-x86_64.tar.gz
            repos/monoflake/driver/target/archives/driver-machine-*-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 3
