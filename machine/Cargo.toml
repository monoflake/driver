[package]
name = "driver-machine"
version = "0.0.0"
description = "driver(machine), the one program a machine runs as its driver, serving its management and its kinds over plain HTTP, and as its command entry the entry, RFCs 8c0rg and rmll5"
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
driver-machine-container = { path = "container" }
driver-machine-function = { path = "function" }
driver-machine-management = { path = "management" }
driver-machine-object = { path = "object" }
codec = { path = "../../platform/code/libs/codec" }
envelope = { path = "../../platform/code/libs/envelope" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
