# The workspace this repository sits under, whose rules and linked configuration it takes.
base = "https://github.com/canmi21/canmi.git"

# What a push of it declares, read by the workspace's push, its docs/agents/pushing.md.
[push]
visibility = "public"

# What the workspace's update moves here besides this repository's own task, its
# docs/toolchain/dependencies.md.
# What this repository exports and what it depends on, RFC 8q1af.
[boundary]
exports = ["driver-archive", "driver-install"]
depends = ["monoflake/platform:contracts", "monoflake/platform:crates"]

[update]
packages = true
actions = true

# The id space its docs/rfcs holds RFCs in, the workspace's scripts/rfcs reading it.
[rfcs]
ids = "monoflake"

# Suffixes this repository alone tracks, formatted by nothing, the workspace's
# docs/toolchain/lint-format.md.
[format]
unformatted = [".capnp", ".sql", ".jsonl"]
# The readings a test reads, kept byte for byte, which neither the suffixes part nor a hook touches.
test_data = [
	"machine/management/tests/first/sys/fs/cgroup",
	"machine/management/tests/second/sys/fs/cgroup",
]

# The verify parts each path covers, so a check runs those a change touches, the workspace's
# docs/agents/checking.md; a path no row matches runs the whole verify. A crate's row names the
# crates using it, as Cargo.toml and package.json have them, and the release's version guard.
[[check.touched]]
paths = ["*.md", "docs/**"]
parts = ["format"]

[[check.touched]]
paths = ["docs/rfcs/**"]
parts = ["format", "model"]

[[check.touched]]
paths = ["model/**"]
parts = ["model"]

[[check.touched]]
paths = ["scripts/**"]
parts = ["format", "test"]

[[check.touched]]
paths = [".github/**"]
parts = ["format", "release"]

[[check.touched]]
paths = ["machine/**"]
parts = ["machine", "release"]

[[check.touched]]
paths = ["machine/volume/**"]
parts = ["volume", "container", "function", "machine", "release"]

[[check.touched]]
paths = ["machine/container/**"]
parts = ["container", "function", "machine", "release"]

[[check.touched]]
paths = ["machine/function/**"]
parts = ["function", "machine", "release"]

[[check.touched]]
paths = ["machine/database/**"]
parts = ["database", "machine", "release"]

[[check.touched]]
paths = ["machine/management/**"]
parts = ["management", "machine", "release"]

[[check.touched]]
paths = ["machine/object/**"]
parts = ["object", "machine", "release"]

[[check.touched]]
paths = ["cloudflare/**"]
parts = ["cloudflare", "release"]

# What the workspace's scripts/release takes, the built.json the release workflow writes and the
# notes' columns, RFC 8c0rg.
[release]
built = "target/archives/built.json"
columns = ["Driver", "Version", "Commit", "Architecture"]

# What a landing's roll reads beyond its defaults, the workspace's scripts/versions.
[versions]
contracts = "model/contracts.json"
repository = "../platform"
pin = ".github/actions/setup/action.yml"

[versions.counts]
machine = ["Cargo.toml", ".github/actions/setup/action.yml"]
cloudflare = [".github/actions/setup/action.yml"]
"cloudflare/object" = [".github/actions/setup/action.yml"]
"cloudflare/database" = [".github/actions/setup/action.yml"]
"cloudflare/function" = [".github/actions/setup/action.yml"]

[versions.serves]
machine = ["management", "deployments", "object"]
"cloudflare/object" = ["object"]
"cloudflare/database" = ["database"]
"cloudflare/management" = ["management"]

# Where the project's own name is a variable a user's code reads beside other vendors', the
# workspace's docs/naming.md.
