# The workspace this repository sits under, whose rules and linked configuration it takes.
base = "https://github.com/canmi21/canmi.git"

# What the workspace's update moves here besides this repository's own task, its docs/toolchain.md.
[update]
packages = true
actions = true

# The id space its docs/rfcs holds RFCs in, the workspace's scripts/rfcs reading it.
[rfcs]
ids = "monoflake"

# What the workspace's scripts/release takes, the built.json the release workflow writes and the
# notes' columns, RFC 8c0rg.
[release]
built = "target/archives/built.json"
columns = ["Program", "Version", "Commit", "Download"]

# Where the project's own name is a variable a user's code reads beside other vendors', the
# workspace's docs/naming.md.
[[names.data]]
file = "machine/container/src/containers.rs"
spelled = ["MONOFLAKE_FOOTING"]

[[names.data]]
file = "machine/container/src/containers/secrets.rs"
spelled = ["MONOFLAKE_FOOTING", "MONOFLAKE_"]

[[names.data]]
file = "machine/function/src/lib.rs"
spelled = ["MONOFLAKE_FOOTING"]

[[names.data]]
file = "machine/container/tests/containers.rs"
spelled = ["MONOFLAKE_FOOTING"]

[[names.data]]
file = "machine/function/tests/workerd/echo.capnp"
spelled = ["MONOFLAKE_FOOTING"]
